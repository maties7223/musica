name: Musica
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    from: 0.0.4
targets:
  Musica:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftOGG
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Música
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.musica
            CFBundleURLSchemes:
              - musica
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.musica
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
