name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild \
            -project Musica.xcodeproj \
            -scheme Musica \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Crear .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Musica.app Payload/
          zip -r Musica.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Musica-ipa
          path: Musica.ipa
